<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallingClaw — AI 会议助手</title>
<link rel="icon" type="image/png" href="./logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F5F7; --white: #FFFFFF; --text: #1C1C1E; --text2: #8E8E93; --text3: #C7C7CC;
  --accent: #E63946; --accent-soft: rgba(230,57,70,0.08); --accent-mid: rgba(230,57,70,0.15);
  --green: #34C759; --green-soft: rgba(52,199,89,0.1);
  --yellow: #FF9F0A; --yellow-soft: rgba(255,159,10,0.1);
  --blue: #007AFF; --blue-soft: rgba(0,122,255,0.1);
  --border: #E5E5EA; --surface: #F2F2F7;
  --radius: 16px; --radius-sm: 10px; --radius-xs: 6px; --pill: 999px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04); --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.08); --ease: 150ms ease;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
a { color: var(--accent); text-decoration: none; } ::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.header {
  height: 56px; min-height: 56px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--white);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-logo { width: 28px; height: 28px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.header-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.header-name { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
.header-ver { font-size: 11px; color: var(--text3); margin-left: 4px; }
.header-right { display: flex; align-items: center; gap: 6px; }
.hdr-btn {
  width: 34px; height: 34px; border-radius: 8px; border: none; background: transparent;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  color: var(--text2); transition: background var(--ease); font-size: 16px; text-decoration: none;
}
.hdr-btn:hover { background: var(--surface); }
.hdr-btn.active { background: var(--accent-soft); color: var(--accent); }

.body { flex: 1; display: flex; overflow: hidden; position: relative; }
.view { display: none; flex: 1; opacity: 0; }
.view.active { display: flex; opacity: 1; animation: viewFadeIn 0.25s ease; }
@keyframes viewFadeIn { from { opacity: 0; } to { opacity: 1; } }
.main-scroll { flex: 1; overflow-y: auto; }
.main-center { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }

.greeting { text-align: center; padding: 48px 0 24px; }
.greeting-emoji { font-size: 48px; display: block; margin-bottom: 12px; }
.greeting h1 { font-size: 28px; font-weight: 400; color: var(--text); line-height: 1.3; letter-spacing: -0.3px; }
.hero-input-wrap { display: flex; gap: 10px; margin-bottom: 32px; }
.hero-input {
  flex: 1; height: 48px; padding: 0 20px; border-radius: var(--radius); border: 1px solid var(--border);
  font-size: 15px; font-family: var(--font); background: var(--white); transition: border-color var(--ease);
  box-shadow: var(--shadow-sm);
}
.hero-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hero-input::placeholder { color: var(--text3); }

.btn {
  padding: 10px 20px; border-radius: var(--pill); font-size: 14px; font-weight: 500;
  border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: all var(--ease); font-family: var(--font); white-space: nowrap;
}
.btn:hover { opacity: 0.9; transform: translateY(-0.5px); } .btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 6px rgba(230,57,70,0.25); }
.btn-primary:hover { box-shadow: 0 4px 10px rgba(230,57,70,0.3); }
.btn-secondary { background: var(--surface); color: var(--text); }
.btn-ghost { background: transparent; color: var(--text2); padding: 10px 16px; }
.btn-ghost:hover { background: var(--surface); color: var(--text); }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn-danger { background: #FEE2E2; color: #DC2626; }
.btn-hero { height: 48px; border-radius: var(--radius); padding: 0 24px; font-size: 15px; font-weight: 600; }

.engine-banner {
  background: linear-gradient(135deg, var(--white) 0%, var(--surface) 100%);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 40px 32px; text-align: center; margin-bottom: 32px; position: relative; overflow: hidden;
}
.engine-banner::before { content: '\26A1'; font-size: 48px; opacity: 0.08; position: absolute; top: 16px; right: 24px; pointer-events: none; }
.engine-banner h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.engine-banner p { font-size: 14px; color: var(--text2); margin-bottom: 20px; line-height: 1.5; }

.meet-section-title {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text2); margin: 28px 0 12px; padding: 0 4px;
}
.meet-list { display: flex; flex-direction: column; gap: 8px; }
.meet-row {
  display: flex; align-items: center; gap: 16px; padding: 16px 20px;
  background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-sm);
  transition: all var(--ease); position: relative;
}
.meet-row.clickable { cursor: pointer; }
.meet-row.clickable:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.meet-date { min-width: 44px; text-align: center; flex-shrink: 0; }
.meet-date-num { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.1; }
.meet-date-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.meet-info { flex: 1; min-width: 0; }
.meet-title { font-size: 15px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meet-time { font-size: 13px; color: var(--text2); }
.meet-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: var(--pill); flex-shrink: 0; white-space: nowrap; }
.badge-live { background: var(--accent); color: #fff; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.badge-soon { background: var(--accent-soft); color: var(--accent); }
.badge-ended { background: var(--surface); color: var(--text3); }
.meet-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
.meet-action {
  font-size: 13px; font-weight: 500; color: var(--text2); cursor: pointer;
  padding: 6px 12px; border-radius: var(--radius-xs); transition: all var(--ease); white-space: nowrap;
}
.meet-action:hover { background: var(--surface); }
.meet-action.local { color: var(--accent); }
.meet-action.local:hover { background: var(--accent-soft); }
.meet-action.join { color: var(--green); }
.meet-action.join:hover { background: var(--green-soft); }
.meet-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.meet-file {
  font-size: 12px; color: var(--text2); padding: 4px 10px;
  background: var(--surface); border-radius: var(--radius-xs);
  display: inline-flex; align-items: center; gap: 5px;
  cursor: pointer; transition: all var(--ease); white-space: nowrap;
}
.meet-file:hover { background: var(--border); }
.meet-file.done { color: var(--green); background: var(--green-soft); }
.meet-file.loading {
  background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.note-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  background: var(--white); border-radius: var(--radius-sm); cursor: pointer;
  transition: all var(--ease); box-shadow: var(--shadow-sm);
}
.note-row:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.note-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--text2); flex-shrink: 0; }
.note-info { flex: 1; min-width: 0; }
.note-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-date { font-size: 12px; color: var(--text3); flex-shrink: 0; }

.empty { text-align: center; padding: 48px 24px; }
.empty p { font-size: 14px; color: var(--text2); line-height: 1.5; }
.fade-in { animation: viewFadeIn 0.3s ease; }

.side-panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(520px, 90vw);
  background: var(--white); border-left: 1px solid var(--border);
  box-shadow: -4px 0 24px rgba(0,0,0,0.08);
  transform: translateX(100%); transition: transform 0.3s ease;
  display: flex; flex-direction: column; z-index: 100;
}
.side-panel.open { transform: translateX(0); }
.sp-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.sp-header h3 { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.sp-close {
  width: 28px; height: 28px; border-radius: 6px; border: none; background: var(--surface);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  color: var(--text2); transition: background var(--ease); flex-shrink: 0; margin-left: 8px; font-size: 16px;
}
.sp-close:hover { background: var(--border); }
.sp-body { flex: 1; overflow-y: auto; padding: 20px; min-height: 0; }

.sp-tabs {
  display: flex; gap: 0; border-bottom: 1px solid var(--border);
  padding: 0 20px; flex-shrink: 0; background: var(--white);
}
.sp-tab {
  padding: 10px 16px; font-size: 12px; font-weight: 500; color: var(--text2);
  border: none; background: none; cursor: pointer; font-family: var(--font);
  border-bottom: 2px solid transparent; transition: all var(--ease); white-space: nowrap;
}
.sp-tab:hover { color: var(--text); }
.sp-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.sp-tab-content { display: none; flex: 1; overflow-y: auto; min-height: 0; }
.sp-tab-content.active { display: flex; flex-direction: column; }
.sp-tab-badge {
  font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: var(--pill);
  margin-left: 4px; vertical-align: middle;
}
.sp-tab-badge.live { background: var(--accent); color: #fff; }
.sp-tab-badge.ready { background: var(--green-soft); color: #15803D; }
.sp-tab-badge.pending { background: var(--surface); color: var(--text3); }

.mp-section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 20px; font-size: 11px; font-weight: 700;
  color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
}
.mp-section-header:hover { background: var(--surface); }
.mp-chevron { font-size: 10px; transition: transform 0.2s; }
.mp-chevron.collapsed { transform: rotate(-90deg); }
.mp-activity { border-bottom: 1px solid var(--border); }
.mp-activity-body { max-height: 200px; overflow-y: auto; padding: 6px 20px; font-size: 12px; transition: max-height 0.2s; }
.mp-activity-body.collapsed { max-height: 0; padding: 0 20px; overflow: hidden; }
.mp-activity-entry { margin-bottom: 5px; line-height: 1.4; display: flex; gap: 6px; align-items: baseline; }
.mp-activity-badge {
  font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 3px;
  flex-shrink: 0; text-transform: uppercase; white-space: nowrap;
}
.mp-activity-badge.delta { background: var(--blue-soft); color: var(--blue); }
.mp-activity-badge.done { background: var(--green-soft); color: var(--green); }
.mp-activity-badge.error { background: rgba(230,57,70,0.1); color: var(--accent); }
.mp-activity-badge.tool { background: var(--yellow-soft); color: var(--yellow); }
.mp-activity-text { color: var(--text2); word-break: break-word; }
.mp-activity-time { font-size: 9px; color: var(--text3); margin-left: auto; flex-shrink: 0; }
.mp-transcript { flex: 1; overflow-y: auto; padding: 10px 20px; font-size: 13px; line-height: 1.6; min-height: 120px; }
.mp-transcript-entry { margin-bottom: 8px; }
.mp-transcript-speaker { font-weight: 600; font-size: 11px; color: var(--blue); margin-bottom: 2px; }
.mp-transcript-text { color: var(--text); }
.mp-transcript-action { color: var(--green); font-size: 12px; font-style: italic; padding: 3px 8px; background: var(--green-soft); border-radius: 6px; margin-top: 3px; }
.mp-transcript-time { font-size: 10px; color: var(--text3); }

.md h1 { font-size: 18px; font-weight: 700; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.md h2 { font-size: 16px; font-weight: 600; margin: 18px 0 8px; }
.md h3 { font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
.md p { font-size: 14px; line-height: 1.7; margin-bottom: 10px; color: var(--text); }
.md ul, .md ol { padding-left: 20px; margin-bottom: 10px; }
.md li { font-size: 14px; line-height: 1.6; margin-bottom: 4px; }
.md code { background: var(--surface); padding: 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 13px; }
.md pre { background: #1C1C1E; color: #E5E5EA; padding: 14px 16px; border-radius: var(--radius-sm); margin-bottom: 12px; overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.5; }
.md strong { font-weight: 600; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

#view-settings { flex-direction: column; background: var(--bg); overflow: hidden; height: 100%; }
.set-head { padding: 16px 32px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); background: var(--white); flex-shrink: 0; }
.set-back { width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); transition: background var(--ease); font-size: 16px; }
.set-back:hover { background: var(--border); }
.set-tabs { display: flex; gap: 4px; padding: 12px 32px 0; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.set-tab { padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--text2); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all var(--ease); margin-bottom: -1px; font-family: var(--font); }
.set-tab:hover { color: var(--text); }
.set-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.set-body { flex: 1; overflow-y: auto; padding: 24px 32px; min-height: 0; }
.set-panel { display: none; } .set-panel.active { display: block; }
.setup-group { margin-bottom: 24px; }
.setup-group h4 { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.3px; }
.chk-list { display: flex; flex-direction: column; gap: 4px; }
.chk { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--white); transition: background var(--ease); }
.chk:hover { background: var(--surface); }
.chk-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
.chk-label { font-size: 14px; flex: 1; }
.chk-val { font-size: 12px; color: var(--text2); }
.input-group { margin-bottom: 16px; }
.input-label { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.input-field { width: 100%; padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 14px; font-family: var(--font); background: var(--white); transition: border-color var(--ease); }
.input-field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.log-console { background: #1C1C1E; color: #E5E5EA; border-radius: var(--radius-sm); padding: 16px; font-family: var(--mono); font-size: 12px; line-height: 1.6; height: 420px; overflow-y: auto; }
.log-line { white-space: pre-wrap; word-break: break-all; }
.log-line.error { color: #FF6B6B; }

.statusbar {
  height: 36px; min-height: 36px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; border-top: 1px solid var(--border); background: var(--white);
  font-size: 11px; color: var(--text2);
}
.st-items { display: flex; align-items: center; gap: 16px; }
.st-item { display: flex; align-items: center; gap: 5px; cursor: default; position: relative; }
.st-item[title]:hover::after {
  content: attr(title); position: absolute; bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%); padding: 4px 8px; border-radius: var(--radius-xs);
  background: var(--text); color: var(--white); font-size: 10px; white-space: nowrap; pointer-events: none; z-index: 100;
}
.st-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); transition: background 0.3s ease; }
.st-dot.green { background: var(--green); } .st-dot.red { background: var(--accent); }
.st-right { display: flex; align-items: center; gap: 12px; }

@media(max-width: 640px) {
  .header { padding: 0 16px; }
  .main-center { padding: 24px 16px 80px; }
  .greeting h1 { font-size: 22px; }
  .meet-row { padding: 12px 16px; gap: 12px; flex-wrap: wrap; }
  .meet-actions { width: 100%; justify-content: flex-end; }
  .side-panel { width: 100vw; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="header-logo"><img src="./logo.png" alt="CallingClaw"></div>
    <span class="header-name">CallingClaw</span>
    <span class="header-ver">2.0</span>
  </div>
  <div class="header-right">
    <button class="hdr-btn" id="btn-settings" title="设置">&#9881;</button>
    <a class="hdr-btn" href="/voice-test" target="_blank" title="语音测试">&#127897;</a>
    <a class="hdr-btn" href="/meeting-view" target="_blank" title="会议视图">&#128250;</a>
  </div>
</header>

<div class="body">
  <div id="view-home" class="view active">
    <div class="main-scroll">
      <div class="main-center">
        <div id="engine-banner-slot"></div>
        <div id="home-static">
          <div class="greeting">
            <span class="greeting-emoji">&#129438;</span>
            <h1>Hey, 下一个会议<br>聊什么话题？</h1>
          </div>
          <div class="hero-input-wrap">
            <input class="hero-input" id="topic-input" placeholder="告诉 CallingClaw 你想讨论什么话题..." onkeydown="if(event.key==='Enter'&&!event.isComposing)submitTopic()">
            <button class="btn btn-primary btn-hero" onclick="submitTopic()">准备会议</button>
          </div>
        </div>
        <div id="meeting-list"></div>
      </div>
    </div>
    <div class="side-panel" id="side-panel">
      <div class="sp-header">
        <h3 id="sp-title">--</h3>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="btn btn-sm btn-danger" id="sp-stop-btn" style="display:none" onclick="stopLocalTalk()">停止</button>
          <button class="sp-close" onclick="closePanel()">&times;</button>
        </div>
      </div>
      <div class="sp-body md" id="sp-body"></div>
    </div>
  </div>

  <div id="view-settings" class="view">
    <div class="set-head">
      <button class="set-back" id="btn-back">&#8592;</button>
      <h3>设置</h3>
    </div>
    <div class="set-tabs" id="set-tabs">
      <button class="set-tab active" data-p="setup">系统检查</button>
      <button class="set-tab" data-p="keys">API 密钥</button>
      <button class="set-tab" data-p="logs">引擎日志</button>
    </div>
    <div class="set-body">
      <div class="set-panel active" id="panel-setup">
        <div class="setup-group"><h4>连接状态</h4><div class="chk-list" id="chk-conn"></div></div>
        <div style="margin-top:12px"><button class="btn btn-sm btn-secondary" onclick="runAllChecks()">重新检测</button></div>
      </div>
      <div class="set-panel" id="panel-keys">
        <div class="setup-group"><h4>API 密钥</h4>
          <div style="background:var(--white);border-radius:var(--radius-sm);padding:16px;">
            <div class="input-group"><div class="input-label">OpenAI API Key</div><input class="input-field" type="password" id="key-openai" placeholder="sk-..."></div>
            <div class="input-group"><div class="input-label">OpenRouter API Key (可选)</div><input class="input-field" type="password" id="key-openrouter" placeholder="sk-or-v1-..."></div>
            <div class="input-group"><div class="input-label">Anthropic API Key (可选)</div><input class="input-field" type="password" id="key-anthropic" placeholder="sk-ant-..."></div>
            <div style="display:flex;align-items:center;gap:8px;">
              <button class="btn btn-sm btn-primary" onclick="saveKeys()">保存密钥</button>
              <span id="key-save-status" style="font-size:11px;color:var(--green);"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="set-panel" id="panel-logs">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><span style="font-size:14px;font-weight:600;">引擎日志</span><button class="btn btn-sm btn-ghost" onclick="clearLogs()">清空</button></div>
        <div class="log-console" id="log-console"></div>
      </div>
    </div>
  </div>
</div>

<footer class="statusbar">
  <div class="st-items">
    <div class="st-item" title="后端引擎状态"><div class="st-dot" id="st-eng"></div><span id="st-eng-t">引擎</span></div>
    <div class="st-item" title="实时语音"><div class="st-dot" id="st-voice"></div><span>语音</span></div>
    <div class="st-item" title="Google 日历"><div class="st-dot" id="st-cal"></div><span>日历</span></div>
    <div class="st-item" title="WebSocket"><div class="st-dot" id="st-ws"></div><span>事件</span></div>
  </div>
  <div class="st-right"><span id="st-ver"></span></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script>
var API = '';
var S = {
  daemon: true, meetings: [], notes: [], tasks: [], status: null,
  wsEvents: null, activeMeetingId: null, meetingMode: null,
  meetingFiles: {}, manifest: null, manifestTs: 0, calendarConnected: false,
};
var localTalkTopic = '', localTalkStarting = false;
var lastEventTs = 0, reconnectDelay = 1000;

var IC = { doc: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' };

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtTime(d) { return new Date(d).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }
function parseNoteFilename(f) {
  var m = f.match(/^(\d{4}-\d{2}-\d{2})_(\d{2})(\d{2})_(.+)\.md$/);
  if (!m) return { date: '', title: f.replace('.md', '') };
  return { date: m[1], time: m[2] + ':' + m[3], title: m[4] };
}
function fmtDateParts(dateStr) {
  var d = new Date(dateStr);
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return { day: d.getDate(), month: months[d.getMonth()], weekday: weekdays[d.getDay()] };
}
function renderMd(src) {
  if (typeof marked !== 'undefined' && marked.parse) return marked.parse(src || '', { breaks: true });
  return esc(src || '').replace(/\n/g, '<br>');
}

// ── Views ───────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(function(v) { v.classList.toggle('active', v.id === 'view-' + name); });
  document.getElementById('btn-settings').classList.toggle('active', name === 'settings');
  if (name === 'settings') runAllChecks();
  if (name === 'home') refreshAll();
}
document.getElementById('btn-settings').onclick = function() { showView('settings'); };
document.getElementById('btn-back').onclick = function() { showView('home'); };
document.getElementById('set-tabs').addEventListener('click', function(e) {
  var tab = e.target.closest('.set-tab'); if (!tab) return;
  document.querySelectorAll('.set-tab').forEach(function(t) { t.classList.toggle('active', t === tab); });
  document.querySelectorAll('.set-panel').forEach(function(p) { p.classList.toggle('active', p.id === 'panel-' + tab.dataset.p); });
});

// ── Data Model ──────────────────────────────────────
function getMeetingData(meetingId) {
  if (!meetingId) meetingId = 'tmp_' + Date.now();
  if (!S.meetingFiles[meetingId]) {
    S.meetingFiles[meetingId] = {
      meetingId: meetingId, topic: '', status: 'preparing',
      prep: { status: 'none', content: null }, summary: { status: 'none', content: null },
      agentFeed: [], meetUrl: null, calendarEventId: null, startTime: null,
      filePaths: {},
    };
  }
  return S.meetingFiles[meetingId];
}
function fetchJSON(url) { return fetch(url, { signal: AbortSignal.timeout(4000) }).then(function(r) { return r.json(); }).catch(function() { return null; }); }

function loadMeetingFile(meetingId, type) {
  if (!meetingId) return Promise.resolve(null);
  var data = getMeetingData(meetingId);
  var fileObj = type === 'prep' ? data.prep : (type === 'summary' ? data.summary : data.prep);
  if (fileObj.status === 'done' && fileObj.content) return Promise.resolve(fileObj.content);
  fileObj.status = 'loading';
  var paths = [];
  var dbPath = data.filePaths && data.filePaths[type];
  if (dbPath) paths.push(dbPath);
  if (type === 'notes' && data.filePaths && data.filePaths.notes) paths.push(data.filePaths.notes);
  paths.push(meetingId + (type === 'prep' ? '_prep.md' : type === 'summary' ? '_summary.md' : '_notes.md'));
  function tryNext(i) {
    if (i >= paths.length) { if (fileObj.status === 'loading') fileObj.status = 'none'; return null; }
    return fetchJSON(API + '/api/shared/file?path=' + encodeURIComponent(paths[i])).then(function(res) {
      if (res && res.content) { fileObj.status = 'done'; fileObj.content = res.content; return res.content; }
      return tryNext(i + 1);
    });
  }
  return tryNext(0);
}

function fetchManifestCached() {
  var now = Date.now();
  if (S.manifest && (now - S.manifestTs) < 30000) return Promise.resolve(S.manifest);
  return fetchJSON(API + '/api/shared/manifest').then(function(data) {
    if (data) { S.manifest = data; S.manifestTs = now; }
    return data || S.manifest;
  });
}

// ── Side Panel ──────────────────────────────────────
function openPanel(title, content) {
  document.getElementById('sp-title').textContent = title;
  S.meetingMode = null;
  document.getElementById('sp-body').innerHTML = typeof content === 'string' && content.startsWith('<') ? content : '<div class="md">' + renderMd(content || '') + '</div>';
  document.getElementById('sp-stop-btn').style.display = 'none';
  document.getElementById('side-panel').classList.add('open');
}
function closePanel() {
  document.getElementById('side-panel').classList.remove('open');
  if (S.meetingMode === 'local') stopLocalTalk();
  S.meetingMode = null; S.activeMeetingId = null;
}

function openMeetingPanel(meetingId, mode) {
  S.activeMeetingId = meetingId; S.meetingMode = mode;
  var data = getMeetingData(meetingId);
  document.getElementById('sp-title').textContent = mode === 'local' ? '本地对话: ' + (data.topic || localTalkTopic) : (data.topic || '会议');
  document.getElementById('sp-stop-btn').style.display = '';
  document.getElementById('sp-body').innerHTML = [
    '<div class="sp-tabs" id="sp-tabs">',
    '<button class="sp-tab active" data-tab="feed" onclick="switchPanelTab(\'feed\')">实时动态<span class="sp-tab-badge live"></span></button>',
    '<button class="sp-tab" data-tab="prep" onclick="switchPanelTab(\'prep\')">会前调研</button>',
    '<button class="sp-tab" data-tab="summary" onclick="switchPanelTab(\'summary\')">会议总结</button>',
    '</div>',
    '<div class="sp-tab-content active" id="sp-tab-feed">',
    '<div class="mp-activity"><div class="mp-section-header" onclick="toggleMpSection(\'activity\')"><span>AI 活动</span><span class="mp-chevron" id="mp-activity-chevron">&#9662;</span></div><div class="mp-activity-body" id="mp-activity-body"></div></div>',
    '<div class="mp-section-header" onclick="toggleMpSection(\'transcript\')"><span>实时记录</span><span class="mp-chevron" id="mp-transcript-chevron">&#9662;</span></div>',
    '<div class="mp-transcript" id="mp-transcript"></div>',
    '</div>',
    '<div class="sp-tab-content" id="sp-tab-prep"><div style="padding:20px;" class="md" id="sp-prep-content">加载中...</div></div>',
    '<div class="sp-tab-content" id="sp-tab-summary"><div style="padding:20px;" class="md" id="sp-summary-content"><div style="text-align:center;color:var(--text3);padding:40px 0;">会议进行中，总结将在结束后生成</div></div></div>',
  ].join('');
  document.getElementById('side-panel').classList.add('open');
  loadMeetingFile(meetingId, 'prep').then(function(content) {
    var el = document.getElementById('sp-prep-content');
    if (el && content) el.innerHTML = renderMd(content);
    else if (el) el.innerHTML = '<div style="text-align:center;color:var(--text3);padding:40px 0;">尚未生成会前调研</div>';
  });
}

function switchPanelTab(tabName) {
  document.querySelectorAll('#sp-tabs .sp-tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === tabName); });
  document.querySelectorAll('.sp-tab-content').forEach(function(c) { c.classList.toggle('active', c.id === 'sp-tab-' + tabName); });
}
function toggleMpSection(id) {
  var bodyId = id === 'activity' ? 'mp-activity-body' : 'mp-transcript';
  var body = document.getElementById(bodyId);
  var chevron = document.getElementById('mp-' + id + '-chevron');
  if (body) body.classList.toggle('collapsed');
  if (chevron) chevron.classList.toggle('collapsed');
}
function addMpActivity(kind, text) {
  var body = document.getElementById('mp-activity-body'); if (!body) return;
  var time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  var div = document.createElement('div'); div.className = 'mp-activity-entry';
  div.innerHTML = '<span class="mp-activity-badge ' + kind + '">' + kind + '</span><span class="mp-activity-text">' + esc(text) + '</span><span class="mp-activity-time">' + time + '</span>';
  body.appendChild(div); body.scrollTop = body.scrollHeight;
  while (body.children.length > 50) body.removeChild(body.firstChild);
}
function addMpTranscript(speaker, text, type) {
  var el = document.getElementById('mp-transcript'); if (!el) return;
  var time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  var div = document.createElement('div'); div.className = 'mp-transcript-entry';
  if (type === 'action') div.innerHTML = '<div class="mp-transcript-speaker">' + esc(speaker) + ' <span class="mp-transcript-time">' + time + '</span></div><div class="mp-transcript-action">' + esc(text) + '</div>';
  else if (type === 'log') div.innerHTML = '<div class="mp-transcript-text" style="font-family:var(--mono);font-size:12px;color:var(--text2);">' + esc(text) + '</div>';
  else div.innerHTML = '<div class="mp-transcript-speaker">' + esc(speaker) + ' <span class="mp-transcript-time">' + time + '</span></div><div class="mp-transcript-text">' + esc(text) + '</div>';
  el.appendChild(div); el.scrollTop = el.scrollHeight;
  while (el.children.length > 100) el.removeChild(el.firstChild);
}

// ── Data Fetching ───────────────────────────────────
function refreshAll() {
  return fetchJSON(API + '/api/status').then(function(status) {
    S.daemon = !!(status && (status.callingclaw === 'running' || status.bridge));
    S.status = status;
    updateStatusBar(); renderEngineBanner();
    if (!S.daemon) { document.getElementById('meeting-list').innerHTML = ''; return; }
    return Promise.all([
      fetchJSON(API + '/api/calendar/events'),
      fetchJSON(API + '/api/meeting/notes'),
      fetchJSON(API + '/api/tasks'),
      fetchManifestCached(),
    ]).then(function(results) {
      var evts = results[0], notes = results[1], tasks = results[2];
      S.calendarConnected = status && (status.calendar === 'connected' || (status.calendar && status.calendar.connected === true));
      var rawMeetings = Array.isArray(evts) ? evts : (evts && evts.events ? evts.events : []);
      S.meetings = rawMeetings.map(function(e) {
        return Object.assign({}, e, {
          start: typeof e.start === 'string' ? { dateTime: e.start } : e.start,
          end: typeof e.end === 'string' ? { dateTime: e.end } : e.end,
          hangoutLink: e.hangoutLink || e.meetLink || null,
        });
      });
      S.notes = Array.isArray(notes) ? notes : (notes && notes.files ? notes.files : []);
      S.tasks = Array.isArray(tasks) ? tasks : (tasks && tasks.tasks ? tasks.tasks : []);
      if (S.manifest && S.manifest.sessions) {
        for (var si = 0; si < S.manifest.sessions.length; si++) {
          var sess = S.manifest.sessions[si]; if (!sess.meetingId) continue;
          var sd = getMeetingData(sess.meetingId);
          sd.topic = sess.topic || sd.topic || '';
          sd.status = sess.status === 'ended' ? 'ended' : sd.status || 'ended';
          sd.meetUrl = sess.meetUrl || sd.meetUrl || null;
          sd.startTime = sess.startTime || sess.date || sd.startTime || null;
          if (sess.files) { sd.filePaths = sess.files; }
        }
      }
      renderMeetings();
    });
  });
}

function renderEngineBanner() {
  var slot = document.getElementById('engine-banner-slot');
  var staticArea = document.getElementById('home-static');
  if (!S.daemon) {
    slot.innerHTML = '<div class="engine-banner fade-in"><h3>CallingClaw 引擎未启动</h3><p>启动后端引擎以连接日历、准备会议和管理待办事项。<br><code style="font-size:12px;color:var(--text2);">cd callingclaw && bun run start</code></p></div>';
    staticArea.style.display = 'none';
  } else { slot.innerHTML = ''; staticArea.style.display = ''; }
}
function updateStatusBar() {
  document.getElementById('st-eng').className = 'st-dot ' + (S.daemon ? 'green' : 'red');
  document.getElementById('st-eng-t').textContent = S.daemon ? '运行中' : '已停止';
  if (S.status) {
    var ic = function(v) { return v === 'connected' || v === true || (v && v.connected === true); };
    document.getElementById('st-voice').className = 'st-dot ' + (ic(S.status.voiceSession) || ic(S.status.voice) || ic(S.status.realtime) ? 'green' : '');
    document.getElementById('st-cal').className = 'st-dot ' + (ic(S.status.calendar) ? 'green' : '');
  }
}

function meetingStatus(event) {
  var now = Date.now(), start = new Date(event.start && event.start.dateTime || event.start && event.start.date).getTime();
  var end = new Date(event.end && event.end.dateTime || event.end && event.end.date).getTime();
  var active = S.status && S.status.meeting && S.status.meeting.active && S.status.meeting.url === event.hangoutLink;
  if (active) return { label: '进行中', cls: 'badge-live' };
  if (now > end) return { label: '已结束', cls: 'badge-ended' };
  if (start - now < 1800000 && start > now) return { label: '即将开始', cls: 'badge-soon' };
  return null;
}
function findMeetingDataForEvent(e) {
  for (var id in S.meetingFiles) { var d = S.meetingFiles[id]; if (d.topic === e.summary || (d.meetUrl && d.meetUrl === e.hangoutLink)) return d; }
  return null;
}
function renderFileAttachments(mf) {
  if (!mf) return '';
  var mid = mf.meetingId;
  var hp = mf.prep.status === 'done' || mf.prep.status === 'loading' || (mf.filePaths && mf.filePaths.prep);
  var hs = mf.summary.status === 'done' || mf.summary.status === 'loading' || (mf.filePaths && mf.filePaths.summary);
  var hn = mf.filePaths && mf.filePaths.notes;
  if (!hp && !hs && !hn) return '';
  var h = '<div class="meet-files" onclick="event.stopPropagation()">';
  if (hp) h += mf.prep.status === 'loading' ? '<span class="meet-file loading">&#128203; Prep...</span>' : '<span class="meet-file done" onclick="openFileInPanel(\'' + esc(mid) + '\',\'prep\')">&#128203; Prep</span>';
  if (hn) h += '<span class="meet-file done" onclick="openFileInPanel(\'' + esc(mid) + '\',\'notes\')">&#128196; Notes</span>';
  if (hs) h += mf.summary.status === 'loading' ? '<span class="meet-file loading">&#128221; Summary...</span>' : '<span class="meet-file done" onclick="openFileInPanel(\'' + esc(mid) + '\',\'summary\')">&#128221; Summary</span>';
  return h + '</div>';
}
function openFileInPanel(meetingId, type) {
  var data = S.meetingFiles[meetingId]; if (!data) return;
  var titles = { prep: '会前调研', notes: '会议记录', summary: '会议总结' };
  var title = titles[type] + ': ' + (data.topic || '');
  var fileObj = type === 'notes' ? (data._notes || (data._notes = { status: 'none', content: null })) : type === 'prep' ? data.prep : data.summary;
  if (fileObj.content) { openPanel(title, fileObj.content); return; }
  openPanel(title, '加载中...');
  loadMeetingFile(meetingId, type).then(function(c) { openPanel(title, c || '暂无内容'); });
}

// ── Render ──────────────────────────────────────────
function renderMeetings() { var el = document.getElementById('meeting-list'); if (el) el.innerHTML = buildMeetingListHTML(); }
function buildMeetingListHTML() {
  var now = Date.now(), active = S.status && S.status.meeting && S.status.meeting.active, html = '';
  if (active) {
    html += '<div class="meet-section-title">Now</div><div class="meet-list"><div class="meet-row" style="border-left:3px solid var(--accent);">';
    html += '<div class="meet-date"><div class="meet-date-num" style="color:var(--accent);">&#9679;</div></div>';
    html += '<div class="meet-info"><div class="meet-title">' + esc(S.status.meeting.topic || '当前会议') + '</div><div class="meet-time">正在录制</div></div>';
    html += '<span class="meet-badge badge-live">进行中</span>';
    html += '<div class="meet-actions"><span class="meet-action" style="color:#DC2626;" onclick="leaveMeeting()">离开</span></div></div></div>';
  }
  var upcoming = S.meetings.filter(function(e) { return new Date(e.start && e.start.dateTime || e.start && e.start.date) > now - 3600000; });
  if (upcoming.length > 0) {
    html += '<div class="meet-section-title">Coming up</div><div class="meet-list">';
    for (var i = 0; i < Math.min(upcoming.length, 8); i++) {
      var e = upcoming[i], start = e.start && (e.start.dateTime || e.start.date), end = e.end && (e.end.dateTime || e.end.date);
      var dp = fmtDateParts(start), st = meetingStatus(e), hasLink = !!e.hangoutLink, mf = findMeetingDataForEvent(e);
      html += '<div class="meet-row clickable" onclick="openCalendarPanel(\'' + esc(e.summary||'') + '\',\'' + esc(e.hangoutLink||'') + '\')">';
      html += '<div class="meet-date"><div class="meet-date-num">' + dp.day + '</div><div class="meet-date-sub">' + dp.month + ' ' + dp.weekday + '</div></div>';
      html += '<div class="meet-info"><div class="meet-title">' + esc(e.summary || '无标题') + '</div>';
      html += '<div class="meet-time">' + fmtTime(start) + (end ? ' - ' + fmtTime(end) : '') + '</div>';
      html += renderFileAttachments(mf) + '</div>';
      if (st && st.cls !== 'badge-ended') html += '<span class="meet-badge ' + st.cls + '">' + st.label + '</span>';
      html += '<div class="meet-actions" onclick="event.stopPropagation()">';
      html += '<span class="meet-action local" onclick="startLocalTalk(\'' + esc(e.summary||'') + '\')">Talk Locally</span>';
      if (hasLink) html += '<span class="meet-action join" onclick="joinMeeting(\'' + esc(e.hangoutLink) + '\')">Join Meeting</span>';
      html += '</div></div>';
    }
    html += '</div>';
  } else if (!active) {
    html += S.calendarConnected
      ? '<div class="empty fade-in"><p>暂无即将到来的会议。使用上方输入框准备话题。</p></div>'
      : '<div class="empty fade-in"><p>Google Calendar 未连接 — 请在设置中检查配置</p></div>';
  }
  html += renderPastHTML();
  return html;
}
function renderPastHTML() {
  var sessions = (S.manifest && S.manifest.sessions) || [], html = '', pastItems = [];
  var endedIds = {};
  for (var id in S.meetingFiles) { if (S.meetingFiles[id].status === 'ended') endedIds[id] = true; }
  for (var si = 0; si < sessions.length; si++) {
    var s = sessions[si];
    pastItems.push({ meetingId: s.meetingId, topic: s.topic, date: s.date || s.startTime });
    if (s.meetingId) endedIds[s.meetingId] = false;
  }
  for (var eid in endedIds) { if (endedIds[eid]) { var d = S.meetingFiles[eid]; pastItems.push({ meetingId: eid, topic: d.topic, date: d.startTime }); } }
  if (pastItems.length === 0 && S.notes.length > 0) {
    html += '<div class="meet-section-title">Past meetings</div><div class="meet-list">';
    for (var ni = 0; ni < Math.min(S.notes.length, 8); ni++) {
      var f = S.notes[ni], name = typeof f === 'string' ? f : f.name || '', p = parseNoteFilename(name);
      html += '<div class="note-row" onclick="openNote(\'' + esc(name) + '\')"><div class="note-icon">' + IC.doc + '</div><div class="note-info"><div class="note-title">' + esc(p.title) + '</div></div><div class="note-date">' + (p.date||'') + '</div></div>';
    }
    html += '</div>'; return html;
  }
  if (pastItems.length === 0) return '';
  html += '<div class="meet-section-title">Past meetings</div><div class="meet-list">';
  for (var pi = 0; pi < Math.min(pastItems.length, 8); pi++) {
    var item = pastItems[pi], mid = item.meetingId || '';
    if (mid && !S.meetingFiles[mid]) { var mfd = getMeetingData(mid); mfd.topic = item.topic || ''; mfd.status = 'ended'; mfd.startTime = item.date || null; }
    var mf = mid ? S.meetingFiles[mid] : null, dp = item.date ? fmtDateParts(item.date) : null;
    html += '<div class="meet-row clickable" onclick="openPastPanel(\'' + esc(mid) + '\')">';
    html += dp ? '<div class="meet-date"><div class="meet-date-num">' + dp.day + '</div><div class="meet-date-sub">' + dp.month + ' ' + dp.weekday + '</div></div>' : '<div class="meet-date"><div class="meet-date-num" style="color:var(--text3)">—</div></div>';
    html += '<div class="meet-info"><div class="meet-title">' + esc(item.topic || '会议') + '</div>';
    if (item.date) html += '<div class="meet-time">' + fmtTime(item.date) + '</div>';
    html += renderFileAttachments(mf) + '</div>';
    html += '<span class="meet-badge" style="background:var(--surface);color:var(--text3);">已结束</span></div>';
  }
  html += '</div>'; return html;
}

// ── Actions ─────────────────────────────────────────
function submitTopic() {
  var inp = document.getElementById('topic-input'), topic = inp.value.trim(); if (!topic) return;
  inp.value = '';
  var tempId = 'prep_' + Date.now(), mf = getMeetingData(tempId);
  mf.topic = topic; mf.status = 'preparing'; mf.prep.status = 'loading';
  mf.agentFeed.push('[' + new Date().toLocaleTimeString('zh-CN') + '] 已提交话题...');
  var listEl = document.getElementById('meeting-list');
  listEl.insertAdjacentHTML('afterbegin', '<div class="meet-list" id="' + tempId + '-wrap"><div class="meet-row clickable" id="' + tempId + '" onclick="openPrepPanel(\'' + tempId + '\')"><div class="meet-date"><div class="meet-date-num" style="color:var(--text3)">--</div></div><div class="meet-info"><div class="meet-title">' + esc(topic) + '</div><div class="meet-time" style="color:var(--text3)">正在创建...</div><div class="meet-files" onclick="event.stopPropagation()"><span class="meet-file loading" id="' + tempId + '-prep">&#128203; Prep...</span></div></div><div class="meet-actions" onclick="event.stopPropagation()"><span class="meet-action local" onclick="startLocalTalk(\'' + esc(topic) + '\')">Talk Locally</span></div></div></div>');
  openPrepPanel(tempId);
  fetch(API + '/api/meeting/delegate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic: topic }) }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.error) return fetch(API + '/api/meeting/prepare', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic: topic }) }).then(function(r) { return r.json(); });
    return data;
  }).then(function(data) {
    mf.agentFeed.push('[' + new Date().toLocaleTimeString('zh-CN') + '] ' + (data.delegatedTo === 'openclaw' ? 'OpenClaw 处理中...' : '后端处理中...'));
    if (data.meetingId) {
      S.meetingFiles[data.meetingId] = mf; mf.meetingId = data.meetingId;
      if (tempId !== data.meetingId) delete S.meetingFiles[tempId];
      var w = document.getElementById(tempId + '-wrap'); if (w) w.id = data.meetingId + '-wrap';
      var c = document.getElementById(tempId); if (c) { c.id = data.meetingId; c.setAttribute('onclick', "openPrepPanel('" + data.meetingId + "')"); }
    }
    if (document.getElementById('side-panel').classList.contains('open')) openPrepPanel(mf.meetingId);
  }).catch(function() { var w = document.getElementById(tempId + '-wrap'); if (w) w.remove(); delete S.meetingFiles[tempId]; });
}
function openPrepPanel(meetingId) {
  var data = S.meetingFiles[meetingId]; if (!data) { openPanel('会前调研', '暂无资料。'); return; }
  if (data.prep.status === 'done' && data.prep.content) { openPanel(data.topic || '会前调研', data.prep.content); return; }
  var md = '# ' + esc(data.topic) + '\n\n> OpenClaw 正在调研中...\n\n## Activity\n\n' + data.agentFeed.map(function(f) { return '- ' + f; }).join('\n') + '\n\n*调研完成后自动更新*';
  openPanel(data.topic || '会前调研', md);
}
function openCalendarPanel(topic, meetUrl) {
  openPanel(topic || '会议详情', '加载中...');
  fetchManifestCached().then(function(manifest) {
    var meetingId = null;
    if (manifest && manifest.sessions) {
      var s = null;
      if (meetUrl) s = manifest.sessions.find(function(x) { return x.meetUrl === meetUrl; });
      if (!s) s = manifest.sessions.find(function(x) { return x.topic === topic; });
      if (s) meetingId = s.meetingId;
    }
    if (!meetingId) { for (var mid in S.meetingFiles) { var m = S.meetingFiles[mid]; if ((meetUrl && m.meetUrl === meetUrl) || (topic && m.topic === topic)) { meetingId = mid; break; } } }
    if (meetingId) {
      var data = getMeetingData(meetingId); data.topic = data.topic || topic; data.meetUrl = data.meetUrl || meetUrl;
      Promise.all([loadMeetingFile(meetingId, 'prep'), loadMeetingFile(meetingId, 'summary')]).then(function(results) {
        var md = meetUrl ? '**会议链接:** ' + meetUrl + '\n\n---\n\n' : '';
        if (results[0]) md += results[0] + '\n\n';
        if (results[1]) md += '---\n## 会议总结\n\n' + results[1] + '\n\n';
        if (!results[0] && !results[1]) md += '> 尚未生成会前调研。\n';
        openPanel(topic || '会议详情', md); renderMeetings();
      });
    } else {
      openPanel(topic || '会议详情', (meetUrl ? '**会议链接:** ' + meetUrl + '\n\n---\n\n' : '') + '> 尚未生成会前调研。\n');
    }
  });
}
function openPastPanel(meetingId) {
  if (!meetingId) return;
  var data = getMeetingData(meetingId), title = data.topic || '会议';
  openPanel(title, '加载中...');
  Promise.all([loadMeetingFile(meetingId, 'prep'), loadMeetingFile(meetingId, 'summary')]).then(function(r) {
    var md = '# ' + esc(title) + '\n\n';
    if (r[0]) md += '## 会前调研\n\n' + r[0] + '\n\n';
    if (r[1]) md += '## 会议总结\n\n' + r[1] + '\n\n';
    if (!r[0] && !r[1]) md += '> 暂无会议文件。\n';
    openPanel(title, md); renderMeetings();
  });
}
function openNote(filename) {
  openPanel(parseNoteFilename(filename).title, '加载中...');
  fetchJSON(API + '/api/meeting/notes/' + encodeURIComponent(filename)).then(function(data) {
    openPanel(parseNoteFilename(filename).title, (data && (data.content || data.text)) || '无法加载');
  });
}
function joinMeeting(url) {
  if (!url) return;
  fetch(API + '/api/meeting/join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url }) }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.meetingId) { var mf = getMeetingData(data.meetingId); mf.status = 'live'; mf.meetUrl = url; S.activeMeetingId = data.meetingId; openMeetingPanel(data.meetingId, 'remote'); }
  }).catch(function() {});
  setTimeout(refreshAll, 3000);
}
function leaveMeeting() { fetch(API + '/api/meeting/leave', { method: 'POST' }).catch(function() {}); setTimeout(refreshAll, 2000); }

function startLocalTalk(topic) {
  if (localTalkStarting) return; localTalkStarting = true;
  localTalkTopic = topic || 'Local Conversation';
  var meetingId = 'local_' + Date.now();
  fetch(API + '/api/meeting/talk-locally', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic: localTalkTopic }) }).then(function(r) { return r.json(); }).then(function(data) {
    meetingId = data.meetingId || meetingId;
    var mf = getMeetingData(meetingId); mf.topic = localTalkTopic; mf.status = 'live';
    S.activeMeetingId = meetingId;
    openMeetingPanel(meetingId, 'local');
    addMpActivity('done', 'Talk locally 已启动');
    if (data.prepBrief) addMpActivity('done', '会前资料: ' + (data.prepBrief.keyPoints || 0) + ' 个要点');
    return fetch(API + '/api/voice/session/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: 'local', transport: 'direct', topic: localTalkTopic }) });
  }).then(function(r) { return r.json(); }).then(function(session) {
    if (session.error) throw new Error(session.error);
    addMpActivity('done', '语音已连接 (' + (session.transport || 'direct') + ')');
  }).catch(function(e) {
    addMpActivity('error', '启动失败: ' + e.message);
  }).finally(function() { localTalkStarting = false; });
}
function stopLocalTalk() {
  fetch(API + '/api/voice/session/stop', { method: 'POST' }).catch(function() {});
  fetch(API + '/api/meeting/talk-locally/stop', { method: 'POST' }).then(function(r) { return r.json(); }).then(function(data) {
    if (data && data.filepath) addMpActivity('done', '记录已保存');
  }).catch(function() {});
  if (S.activeMeetingId && S.meetingFiles[S.activeMeetingId]) S.meetingFiles[S.activeMeetingId].status = 'ended';
  document.getElementById('sp-stop-btn').style.display = 'none';
  S.meetingMode = null; S.activeMeetingId = null; updateStatusBar();
}

// ── Settings ────────────────────────────────────────
function saveKeys() {
  var body = {};
  var oai = document.getElementById('key-openai').value.trim();
  var orr = document.getElementById('key-openrouter').value.trim();
  var ant = document.getElementById('key-anthropic').value.trim();
  if (oai) body.openai_api_key = oai; if (orr) body.openrouter_api_key = orr; if (ant) body.anthropic_api_key = ant;
  if (!Object.keys(body).length) return;
  fetch(API + '/api/keys', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function(r) {
    if (r.ok) {
      document.getElementById('key-save-status').textContent = '✓ 已保存';
      document.getElementById('key-openai').value = ''; document.getElementById('key-openrouter').value = ''; document.getElementById('key-anthropic').value = '';
      setTimeout(function() { document.getElementById('key-save-status').textContent = ''; }, 2000);
    }
  }).catch(function() {});
}
function runAllChecks() {
  var el = document.getElementById('chk-conn');
  el.innerHTML = '<div class="chk"><span class="chk-icon">&#8987;</span><span class="chk-label">检测中...</span></div>';
  Promise.all([fetchJSON(API + '/api/status'), fetchJSON(API + '/api/keys')]).then(function(results) {
    var status = results[0], keys = results[1];
    var ic = function(v) { return v === 'connected' || v === true || (v && v.connected === true); };
    var items = [];
    items.push({ icon: status ? '&#9989;' : '&#10060;', label: '后端引擎', val: status ? '运行中' : '未连接' });
    if (status) {
      items.push({ icon: ic(status.bridge) || ic(status.sidecar) ? '&#9989;' : '&#9898;', label: 'Python Bridge', val: ic(status.bridge) || ic(status.sidecar) ? '已连接' : '未连接' });
      items.push({ icon: ic(status.realtime) || ic(status.voice) ? '&#9989;' : '&#9898;', label: '语音 (Realtime)', val: ic(status.realtime) || ic(status.voice) ? '已连接' : '未连接' });
      items.push({ icon: ic(status.calendar) ? '&#9989;' : '&#9898;', label: 'Google Calendar', val: ic(status.calendar) ? '已连接' : '未连接' });
      items.push({ icon: ic(status.openclaw) ? '&#9989;' : '&#9898;', label: 'OpenClaw', val: ic(status.openclaw) ? '已连接' : '未连接' });
    }
    if (keys) {
      items.push({ icon: keys.openai ? '&#128273;' : '&#10060;', label: 'OpenAI Key', val: keys.openai || '未设置' });
      items.push({ icon: keys.openrouter ? '&#128273;' : '&#9898;', label: 'OpenRouter Key', val: keys.openrouter || '未设置' });
      items.push({ icon: keys.anthropic ? '&#128273;' : '&#9898;', label: 'Anthropic Key', val: keys.anthropic || '未设置' });
    }
    el.innerHTML = items.map(function(i) { return '<div class="chk"><span class="chk-icon">' + i.icon + '</span><span class="chk-label">' + i.label + '</span><span class="chk-val">' + i.val + '</span></div>'; }).join('');
  }).catch(function() {
    el.innerHTML = '<div class="chk"><span class="chk-icon">&#10060;</span><span class="chk-label">无法连接后端</span><span class="chk-val">请确认引擎已启动</span></div>';
  });
}

// ── Logs ────────────────────────────────────────────
function clearLogs() { document.getElementById('log-console').innerHTML = ''; }
function addLog(text, isError) {
  var el = document.getElementById('log-console'), div = document.createElement('div');
  div.className = 'log-line' + (isError ? ' error' : '');
  div.textContent = '[' + new Date().toLocaleTimeString('zh-CN') + '] ' + text;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
  while (el.children.length > 500) el.removeChild(el.firstChild);
}

// ── Meeting Events ──────────────────────────────────
function handleMeetingEvent(event) {
  var type = event.type, data = event.data || {};
  if (event.timestamp) lastEventTs = Math.max(lastEventTs, event.timestamp);
  switch (type) {
    case 'meeting.started': if (data.meetingId && !S.activeMeetingId) S.activeMeetingId = data.meetingId; addMpActivity('done', '已加入会议'); break;
    case 'meeting.ended': addMpActivity('done', '会议已结束'); if (S.activeMeetingId && S.meetingFiles[S.activeMeetingId]) S.meetingFiles[S.activeMeetingId].status = 'ended'; S.meetingMode = null; break;
    case 'voice.tool_call': addMpActivity('tool', data.tool || 'tool call'); break;
    case 'computer.task_done': addMpTranscript('自动化', data.summary || '', 'action'); addMpActivity('done', data.summary || 'done'); break;
    case 'openclaw.delta': addMpActivity('delta', data.summary || data.text || '...'); break;
    case 'openclaw.done': addMpActivity('done', data.summary || '完成'); break;
    case 'openclaw.error': addMpActivity('error', data.summary || data.message || '错误'); break;
    case 'meeting.action_item': addMpTranscript('行动项', data.text || '', 'action'); break;
    case 'transcript.entry': addMpTranscript(data.speaker || '参与者', data.text || ''); break;
    case 'meeting.live_entry': addMpTranscript('', data.entry || '', 'log'); break;
    case 'meeting.live_note': addMpActivity('delta', data.note || ''); break;
    case 'meeting.prep_ready': addMpActivity('done', '调研完成'); break;
    case 'meeting.vision': addMpActivity('delta', '[视觉] ' + (data.description || '').slice(0, 60)); break;
  }
}

// ── WebSocket ───────────────────────────────────────
function connectWS() {
  try {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    S.wsEvents = new WebSocket(proto + '//' + (location.host || 'localhost:4000') + '/ws/events');
    S.wsEvents.onopen = function() { document.getElementById('st-ws').className = 'st-dot green'; reconnectDelay = 1000; addLog('WebSocket 已连接'); };
    S.wsEvents.onmessage = function(e) { try { routeWsEvent(JSON.parse(e.data)); } catch(err) {} };
    S.wsEvents.onclose = function() { document.getElementById('st-ws').className = 'st-dot'; setTimeout(connectWS, reconnectDelay); reconnectDelay = Math.min(reconnectDelay * 2, 30000); };
  } catch(err) {}
}
function routeWsEvent(msg) {
  var type = msg.type || msg.event;
  if (msg.timestamp) lastEventTs = Math.max(lastEventTs, msg.timestamp);
  if (type === 'meeting.started' || type === 'meeting.ended' || type === 'meeting.agenda') setTimeout(refreshAll, 500);
  if (S.meetingMode) handleMeetingEvent({ type: type, data: msg.data || {}, timestamp: msg.timestamp });

  if (type === 'meeting.prep_progress' && msg.data) {
    var targets = [];
    for (var pid in S.meetingFiles) { if (S.meetingFiles[pid].prep.status !== 'done') targets.push(S.meetingFiles[pid]); }
    if (msg.data.meetingId) {
      for (var ti = 0; ti < targets.length; ti++) {
        if (targets[ti].meetingId !== msg.data.meetingId && targets[ti].meetingId.startsWith('prep_')) {
          S.meetingFiles[msg.data.meetingId] = targets[ti]; delete S.meetingFiles[targets[ti].meetingId]; targets[ti].meetingId = msg.data.meetingId; break;
        }
      }
    }
    targets.forEach(function(pd) {
      pd.agentFeed.push('[' + new Date().toLocaleTimeString('zh-CN') + '] ' + (msg.data.message || msg.data.step || ''));
      var card = document.getElementById(pd.meetingId);
      if (card && msg.data.title) { var t = card.querySelector('.meet-title'); if (t) t.textContent = msg.data.title; pd.topic = msg.data.title; }
      if (card && msg.data.meetUrl) {
        pd.meetUrl = msg.data.meetUrl;
        var actions = card.querySelector('.meet-actions');
        if (actions && !actions.querySelector('.join')) actions.insertAdjacentHTML('beforeend', '<span class="meet-action join" onclick="event.stopPropagation();joinMeeting(\'' + esc(msg.data.meetUrl) + '\')">Join Meeting</span>');
      }
      if (document.getElementById('side-panel').classList.contains('open')) openPrepPanel(pd.meetingId);
    });
  }
  if ((type === 'openclaw.delta' || type === 'openclaw.done') && !S.meetingMode) {
    for (var ocId in S.meetingFiles) {
      var oc = S.meetingFiles[ocId];
      if (oc.prep.status !== 'done' && oc.agentFeed) {
        var t = (msg.data && (msg.data.text || msg.data.delta)) || '';
        if (t) oc.agentFeed.push('[' + new Date().toLocaleTimeString('zh-CN') + '] ' + (t.length > 60 ? t.slice(0,60)+'...' : t));
        if (document.getElementById('side-panel').classList.contains('open')) openPrepPanel(ocId);
      }
    }
  }
  if (type === 'meeting.prep_ready' && msg.data) {
    var target = msg.data.meetingId && S.meetingFiles[msg.data.meetingId] ? S.meetingFiles[msg.data.meetingId] : null;
    if (!target) { for (var prid in S.meetingFiles) { if (S.meetingFiles[prid].prep.status !== 'done') { target = S.meetingFiles[prid]; break; } } }
    if (target) {
      target.prep.status = 'done'; target.prep.content = msg.data.mdContent || '';
      var badge = document.getElementById(target.meetingId + '-prep');
      if (badge) { badge.className = 'meet-file done'; badge.innerHTML = '&#128203; Prep'; }
      if (document.getElementById('side-panel').classList.contains('open')) openPrepPanel(target.meetingId);
      renderMeetings();
    }
  }
  addLog('[' + type + '] ' + JSON.stringify(msg.data || {}).slice(0, 100));
}

// ── Init ────────────────────────────────────────────
refreshAll();
connectWS();
setInterval(refreshAll, 15000);
</script>
