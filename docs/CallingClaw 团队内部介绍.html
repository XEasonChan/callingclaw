  <script>
    const manifest = {
      slides: [
        { file: "slides/slide-01.html", title: "封面 — AI That Joins Your Meetings" },
        { file: "slides/slide-02.html", title: "痛点 — IM 里的 AI Agent" },
        { file: "slides/slide-03.html", title: "市场信号 — Pika 的启示" },
        { file: "slides/slide-04.html", title: "方向 — 数字员工进入会议室" },
        { file: "slides/slide-agentware.html", title: "The First Agentware" },
        { file: "slides/slide-05.html", title: "CallingClaw 是什么" },
        { file: "slides/slide-06.html", title: "会前 — 自动准备" },
        { file: "slides/slide-flow.html", title: "实际流程 — 从一句话到自动开会" },
        { file: "slides/slide-07.html", title: "会中 — 语音 + 视觉 + 操作" },
        { file: "slides/slide-08.html", title: "会后 — 总结 → 执行" },
        { file: "slides/slide-09.html", title: "架构创新 — 双脑 + 本地记忆" },
        { file: "slides/slide-10.html", title: "竞品格局" },
        { file: "slides/slide-11.html", title: "当前进展" },
        { file: "slides/slide-12.html", title: "Launch 计划" }
      ]
    };

    let currentSlide = 0;
    const frame = document.getElementById('slideFrame');
    const counter = document.getElementById('counter');
    const titleDisplay = document.getElementById('titleDisplay');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    async function loadSlide(index) {
      const slide = manifest.slides[index];
      const res = await fetch(slide.file);
      const html = await res.text();
      
      // Load theme
      const themeRes = await fetch('theme.css');
      const theme = await themeRes.text();

      const doc = `<!DOCTYPE html>
<html><head>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>${theme}</style>
<style>html,body{width:100%;height:100%;overflow:hidden;margin:0;padding:0;}</style>
</head><body>${html}</body></html>`;

      frame.srcdoc = doc;
      counter.textContent = `${index + 1} / ${manifest.slides.length}`;
      titleDisplay.textContent = slide.title;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === manifest.slides.length - 1;
    }

    function navigate(dir) {
      const next = currentSlide + dir;
      if (next >= 0 && next < manifest.slides.length) {
        currentSlide = next;
        loadSlide(currentSlide);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') navigate(1);
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'f' || e.key === 'F') {
        document.documentElement.requestFullscreen?.();
      }
    });

    // Auto-scale slide frame to fill viewport
    function resizeFrame() {
      const el = document.querySelector('.slide-frame');
      const pad = 120; // room for nav bar
      const scale = Math.min(window.innerWidth / 1920, (window.innerHeight - pad) / 1080);
      el.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeFrame);
    resizeFrame();

    loadSlide(0);
  </script>

:root,

  --c-00: #000000;

  --c-66: #666666;
  --c-83: #838383;

  --p-main: #ea4c89;
  --p-hover: #ec5e95;

}

:root[data-theme="dark"],
[data-theme="dark"] {
  /* 中性灰阶（dark） */
  --c-00: #ffffff;
  --c-22: #dbdbdb;
  --c-33: #dbdbdb;
  --c-66: #b3b3b3;
  --c-83: #838383;
  --c-99: #707070;

[type="checkbox"],

  width: 1.25em;

  margin-left: 0;

}
[type="checkbox"]::-ms-check,
[type="radio"]::-ms-check {
  display: none;
}
[type="checkbox"]:checked,
[type="checkbox"]:checked:active,
[type="checkbox"]:checked:focus,
[type="radio"]:checked,
[type="radio"]:checked:active,
[type="radio"]:checked:focus {

[type="radio"]:checked,
[type="radio"]:checked:active,
[type="radio"]:checked:focus {

:where(#mount) [type="checkbox"][role="switch"] {
  --background-color: var(--switch-background-color);
  --border-color: var(--switch-background-color);
  --color: var(--switch-color);
  width: 2.25em;
  height: 1.25em;
  border: var(--border-width) solid var(--border-color);
  border-radius: 1.25em;
  background-color: var(--background-color);
  line-height: 1.25em;
}
:where(#mount) [type="checkbox"][role="switch"]:focus {
  --background-color: var(--switch-background-color);
  --border-color: var(--switch-background-color);
}
:where(#mount) [type="checkbox"][role="switch"]:checked {
  --background-color: var(--switch-checked-background-color);
  --border-color: var(--switch-checked-background-color);
}
:where(#mount) [type="checkbox"][role="switch"]:before {
  display: block;
  width: calc(1.25em - (var(--border-width) * 2));
  height: 100%;
  border-radius: 50%;
  background-color: var(--color);
  content: "";
  transition: margin 0.1s ease-in-out;
}
:where(#mount) [type="checkbox"][role="switch"]:checked {
  background-image: none;
}
:where(#mount) [type="checkbox"][role="switch"]:checked::before {
  margin-left: calc(1.125em - var(--border-width));
  -webkit-margin-start: calc(1.125em - var(--border-width));
  margin-inline-start: calc(1.125em - var(--border-width));
}

:where(#mount) [type="checkbox"]:checked[aria-invalid="false"],
:where(#mount) [type="radio"][aria-invalid="false"],
:where(#mount) [type="radio"]:checked[aria-invalid="false"],

:where(#mount) [type="checkbox"][aria-invalid="true"],

:where(#mount) [type="radio"][aria-invalid="true"],
:where(#mount) [type="radio"]:checked[aria-invalid="true"],

:where(#mount) [type="checkbox"][role="switch"]:checked[aria-invalid="true"] {
